<style>
        body { background-color: #f9f9f9; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .header-bg { background-color: #000000; transition: opacity 0.8s ease-out, transform 0.8s ease-out; }

        /* ── New Jobs Refresh Button ─────────────────────── */
        #new-jobs-btn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: 2px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        #new-jobs-btn.btn-disabled {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.35);
            cursor: not-allowed;
            pointer-events: none;
        }
        #new-jobs-btn.btn-active {
            background: #007BFF;
            border-color: #007BFF;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0,123,255,0.4);
            animation: pulse-glow 2s infinite;
        }
        #new-jobs-btn.btn-active:hover {
            background: #0066dd;
            transform: translateY(-1px);
            box-shadow: 0 4px 24px rgba(0,123,255,0.5);
        }
        #new-jobs-btn.btn-loading {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.5);
            cursor: wait;
            pointer-events: none;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 12px rgba(0,123,255,0.4); }
            50%       { box-shadow: 0 0 28px rgba(0,123,255,0.7); }
        }
        .btn-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        .btn-dot.pulsing {
            background: #4ade80;
            animation: dot-pulse 1.4s infinite;
        }
        .btn-dot.running {
            background: #facc15;
            animation: dot-spin 1s linear infinite;
            border-radius: 1px;
        }
        @keyframes dot-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.6); }
        }
        @keyframes dot-spin {
            to { transform: rotate(360deg); }
        }
        .cycle-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            font-size: 9px;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .cursor-dot {
            width: 6px; height: 6px; background-color: #007BFF;
            position: fixed; top: 0; left: 0; border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transition: transform 0.1s ease-out, background-color 0.3s ease;
        }
        .cursor-outline {
            width: 30px; height: 30px; border: 2px solid rgba(0, 123, 255, 0.4);
            position: fixed; top: 0; left: 0; border-radius: 50%;
            pointer-events: none; z-index: 9998;
            transition: transform 0.15s ease-out, width 0.3s ease, height 0.3s ease, border-color 0.3s ease, opacity 0.3s ease, background-color 0.3s ease;
        }
        .cursor-active .cursor-outline { width: 45px; height: 45px; border-color: #007BFF; background-color: rgba(0, 123, 255, 0.05); }
        .cursor-active .cursor-dot { transform: scale(1.5); }
        .cursor-search .cursor-outline { width: 60px; height: 60px; border-color: #007BFF; background-color: rgba(0, 123, 255, 0.1); opacity: 0.8; }

        .skeleton { 
            background: linear-gradient(90deg, #f3f3f3 25%, #ffffff 50%, #f3f3f3 75%); 
            background-size: 200% 100%; 
            animation: shimmer 1.5s infinite linear; 
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .card-entry { opacity: 0; transform: translateY(20px); transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .card-entry.visible { opacity: 1; transform: translateY(0); }

        .hover-card { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease; }
        .hover-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 15px 40px -12px rgba(0, 0, 0, 0.08); border-color: #007BFF; }
        
        .stat-card { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease; }
        .stat-card:hover { transform: translateY(-2px); border-color: #007BFF; }

        @keyframes focus-pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.2); }
            50% { box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1); }
            100% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.2); }
        }
        .focus-glow:focus-within { animation: focus-pulse 2s infinite ease-in-out; border-color: #007BFF; }

        .magnetic-wrap { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform; }

        .progress-bar { transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; }
        .progress-bar::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: barShimmer 2s infinite;
        }
        @keyframes barShimmer { 100% { left: 100%; } }

        a, button, input { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        @media (prefers-reduced-motion: reduce) {
            .card-entry, .hover-card, .progress-bar, .stat-card, .cursor-dot, .cursor-outline, .header-bg, .focus-glow {
                animation: none !important; transition: none !important; transform: none !important;
            }
            .cursor-dot, .cursor-outline { display: none; }
        }

        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hairline-border { border: 1px solid #e2e2e2; }
        .parallax-init { opacity: 0; transform: translateY(-10px); }
    </style>
</head>

<script>
    // ── Real jobs data from API ──────────────────────────
    let allJobs = [];
    let searchQuery = '';
    let currentFilter = 'all';

    // ── Cycle / Run-status state ─────────────────────────
    let _lastKnownCycle   = 0;   // cycle count when page first loaded
    let _lastFinishedAt   = null; // ISO string of last completed cycle
    let _cycleCheckTimer  = null;
    let _newCycleReady    = false;

    // Cursor Logic (unchanged)
    const dot = document.getElementById('cursor-dot');
    const outline = document.getElementById('cursor-outline');
    window.addEventListener('mousemove', (e) => {
        dot.style.transform = `translate(${e.clientX - 3}px, ${e.clientY - 3}px)`;
        outline.animate({ transform: `translate(${e.clientX - 15}px, ${e.clientY - 15}px)` }, { duration: 400, fill: "forwards", easing: "cubic-bezier(0.16, 1, 0.3, 1)" });
    });

    // Magnetic Search Logic (unchanged)
    const searchWrap = document.getElementById('search-magnetic-container');
    const searchIcon = document.getElementById('search-icon-magnetic');
    const searchInput = document.getElementById('job-search');
    searchWrap.addEventListener('mousemove', (e) => {
        const rect = searchWrap.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        searchInput.style.transform = `translate(${x * 0.1}px, ${y * 0.1}px)`;
        searchIcon.style.transform = `translate(${x * 0.25}px, calc(-50% + ${y * 0.25}px))`;
    });
    searchWrap.addEventListener('mouseleave', () => {
        searchInput.style.transform = `translate(0, 0)`;
        searchIcon.style.transform = `translate(0, -50%)`;
    });

    // Cursor Hover Logic (unchanged)
    const updateInteractiveListeners = () => {
        document.querySelectorAll('button, a, .interactive, .hover-card, input').forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('cursor-active'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-active'));
        });
        const searchInputEl = document.querySelector('.interactive-search');
        if (searchInputEl) {
            searchInputEl.addEventListener('mouseenter', () => document.body.classList.add('cursor-search'));
            searchInputEl.addEventListener('mouseleave', () => document.body.classList.remove('cursor-search'));
        }
    };

    // ── Initial Load — fetch real data ───────────────────
    window.addEventListener('DOMContentLoaded', () => {
        const header = document.getElementById('main-header');
        setTimeout(() => {
            header.style.opacity = '1';
            header.style.transform = 'translateY(0)';
        }, 100);

        setTimeout(() => {
            loadJobs();
            // Show the button and start polling for new cycles
            document.getElementById('new-jobs-btn').style.display = 'flex';
            checkRunStatus(true); // initial check
            _cycleCheckTimer = setInterval(() => checkRunStatus(false), 30000); // every 30s
        }, 400);
    });

    // ── Run-status polling ───────────────────────────────
    function checkRunStatus(isInitial) {
        fetch('/api/run-status')
            .then(r => r.json())
            .then(data => {
                const btn      = document.getElementById('new-jobs-btn');
                const dot      = document.getElementById('btn-dot');
                const label    = document.getElementById('btn-label');
                const badge    = document.getElementById('cycle-badge');
                const status   = data.status;   // 'running' | 'done' | 'idle'
                const cycle    = data.cycle || 0;
                const finished = data.finished_at;

                if (isInitial) {
                    // Snapshot the current state so we can detect future completions
                    _lastKnownCycle = cycle;
                    _lastFinishedAt = finished;
                }

                if (status === 'running') {
                    // A cycle is actively running — disable button
                    _newCycleReady = false;
                    btn.className = 'btn-disabled interactive';
                    dot.className = 'btn-dot running';
                    label.textContent = 'Scanning...';
                    badge.style.display = 'none';

                } else if (status === 'done' || status === 'idle') {
                    // Check if a NEW cycle just completed (cycle count increased)
                    const isNewCycle = !isInitial && (
                        cycle > _lastKnownCycle ||
                        (finished && finished !== _lastFinishedAt)
                    );

                    if (isNewCycle) {
                        // New cycle is done — activate button
                        _newCycleReady   = true;
                        _lastKnownCycle  = cycle;
                        _lastFinishedAt  = finished;

                        btn.className = 'btn-active interactive';
                        dot.className = 'btn-dot pulsing';
                        label.textContent = 'New Jobs Ready';
                        badge.textContent = cycle;
                        badge.style.display = 'inline-flex';

                    } else if (isInitial && status === 'done') {
                        // On first load — show a neutral idle state (already up to date)
                        btn.className = 'btn-disabled interactive';
                        dot.className = 'btn-dot';
                        dot.style.background = '#6b7280';
                        label.textContent = 'Up to date';
                        badge.style.display = 'none';
                    }
                }
            })
            .catch(() => { /* silently ignore network errors */ });
    }

    // ── Load new cycle jobs when button clicked ───────────
    function loadNewCycleJobs() {
        if (!_newCycleReady) return;
        _newCycleReady = false;

        const btn   = document.getElementById('new-jobs-btn');
        const dot   = document.getElementById('btn-dot');
        const label = document.getElementById('btn-label');
        const badge = document.getElementById('cycle-badge');

        // Show loading state
        btn.className = 'btn-loading interactive';
        dot.className = 'btn-dot running';
        label.textContent = 'Loading...';
        badge.style.display = 'none';

        // Re-fetch jobs (which automatically recalculates stats)
        loadJobsAndReturn()
            .then(() => {
                // Back to idle / up-to-date state
                btn.className = 'btn-disabled interactive';
                dot.className = 'btn-dot';
                dot.style.background = '#6b7280';
                label.textContent = 'Up to date';
            })
            .catch(() => {
                btn.className = 'btn-disabled interactive';
                label.textContent = 'Error — retry';
            });
    }

    // Separate loadJobs that returns a Promise
    function loadJobsAndReturn() {
        return fetch('/api/jobs?t=' + Date.now())
            .then(r => r.json())
            .then(data => {
                allJobs = data.map(job => ({
                    id: job.id,
                    title: job.title || 'Unknown Role',
                    company: job.company || 'Unknown',
                    location: job.location || '—',
                    posted_at: job.posted_at || '',
                    platform: job.platform || 'unknown',
                    type: (() => {
                        const r = job.resume_used || job.resume_type || '';
                        if (r === 'aiml') return 'AI/ML';
                        if (r === 'devops') return 'DevOps';
                        return 'General';
                    })(),
                    match: job.score || 0,
                    status: job.score_bucket || 'skip',
                    url: job.url || '#',
                    applied: job.status === 'applied',
                    skills: {
                        matched: Array.isArray(job.matched_skills) ? job.matched_skills : [],
                        missing: Array.isArray(job.missing_skills) ? job.missing_skills : []
                    },
                    recommendation: job.recommendation || ''
                }));
                applyFilters();
                updateInteractiveListeners();
            });
    }

    // ── Calculate Stats from VISIBLE jobs (always exact match) ──
    function loadStats(visibleJobs) {
        const jobs    = visibleJobs !== undefined ? visibleJobs : allJobs;
        const total   = jobs.length;
        const urgent  = jobs.filter(j => j.match >= 85).length;
        const aiml    = jobs.filter(j => j.type === 'AI/ML').length;
        const devops  = jobs.filter(j => j.type === 'DevOps').length;
        const applied = jobs.filter(j => j.applied === true).length;

        const stats = [
            { label: "TOTAL JOBS",      value: total,   icon: "radar",                color: "#000000" },
            { label: "HIGH MATCH 85%+", value: urgent,  icon: "verified",             color: "#007BFF" },
            { label: "AI / ML JOBS",    value: aiml,    icon: "smart_toy",            color: "#7C3AED" },
            { label: "DEVOPS JOBS",     value: devops,  icon: "cloud",                color: "#0EA5E9" },
            { label: "APPLIED",         value: applied, icon: "assignment_turned_in", color: "#16A34A" }
        ];
        renderStats(stats);
    }

    // ── Load Jobs from Flask API ─────────────────────────
function loadJobs() {
    fetch('/api/jobs?t=' + Date.now())
        .then(r => r.json())
        .then(data => {

            // Normalize API data to match renderJobs format
            allJobs = data.map(job => ({

                id: job.id,

                title: job.title || 'Unknown Role',

                company: job.company || 'Unknown',

                location: job.location || '—',

                // ✅ FIX ADDED HERE

                posted_at: job.posted_at || '',

                platform: job.platform || 'unknown',

                type: (() => {
                    const r = job.resume_used || job.resume_type || '';

                    if (r === 'aiml') return 'AI/ML';

                    if (r === 'devops') return 'DevOps';

                    return 'General';
                })(),

                match: job.score || 0,

                status: job.score_bucket || 'skip',

                url: job.url || '#',

                applied: job.status === 'applied',

                skills: {
                    matched: Array.isArray(job.matched_skills)
                        ? job.matched_skills
                        : [],

                    missing: Array.isArray(job.missing_skills)
                        ? job.missing_skills
                        : []
                },

                recommendation: job.recommendation || ''
            }));

            applyFilters();
            updateInteractiveListeners();
        })

        .catch(err => {

            console.error('Jobs fetch failed:', err);

            document.getElementById('jobs-grid').innerHTML = `
                <div class="col-span-full py-xl text-center">
                    <p class="text-on-surface-variant font-body-lg">
                        SYSTEM: No jobs found. Run the agent to scrape jobs.
                    </p>
                </div>
            `;
        });
}

    // ── Stats Rendering ───────────────────────────────────
    const statFilters = ['all', 'urgent', 'aiml', 'devops', 'applied'];

    function renderStats(stats) {
        const container = document.getElementById('stats-container');
        container.innerHTML = stats.map((stat, idx) => `
            <div class="bg-white p-6 hairline-border stat-card group interactive card-entry cursor-pointer select-none"
                 data-filter="${statFilters[idx]}"
                 style="transition-delay: ${idx * 50}ms">
                <div class="flex justify-between items-center mb-4">
                    <p class="font-label-md text-[11px] text-on-surface-variant uppercase tracking-widest">${stat.label}</p>
                    <span class="material-symbols-outlined text-xl group-hover:scale-125 transition-transform" style="color: ${stat.color}">${stat.icon}</span>
                </div>
                <h3 class="font-headline-md text-headline-sm font-bold tracking-tight counter" data-target="${stat.value}">0</h3>
            </div>
        `).join('');
        setTimeout(() => {
            container.querySelectorAll('.card-entry').forEach(el => el.classList.add('visible'));
            animateCounters();
        }, 10);

        // click → trigger the matching filter button
        container.querySelectorAll('[data-filter]').forEach(card => {
            card.addEventListener('click', () => {
                const f = card.getAttribute('data-filter');
                const btn = document.querySelector(`#filter-buttons [data-filter="${f}"]`);
                if (btn) btn.click();
                // highlight active stat card
                container.querySelectorAll('[data-filter]').forEach(c => c.classList.remove('ring-2', 'ring-vibrant-blue'));
                card.classList.add('ring-2', 'ring-vibrant-blue');
            });
        });
    }

    // ── Job Rendering (unchanged look) ───────────────────
    function renderJobs(jobs) {
        const container = document.getElementById('jobs-grid');
        if (jobs.length === 0) {
            container.innerHTML = `<div class="col-span-full py-xl text-center"><p class="text-on-surface-variant font-body-lg">SYSTEM: No results matching query parameters.</p></div>`;
            return;
        }

        container.innerHTML = jobs.map((job, idx) => `
            <div class="bg-white p-6 hairline-border hover-card flex flex-col gap-4 card-entry" id="job-${job.id}" style="transition-delay: ${idx * 60}ms">
                <div class="flex justify-between items-start">
                    <div>
                        <h4 class="font-headline-sm text-[20px] text-primary font-bold leading-tight tracking-tight">${job.title}</h4>
                        <p class="text-on-surface-variant font-body-sm mt-1">${job.company} <span class="mx-1 opacity-40">•</span> ${job.location}</p>
                    </div>
                    <div class="flex flex-col items-end gap-1">
                        <span class="px-2 py-0.5 bg-primary text-white text-[9px] font-label-md uppercase tracking-widest">${job.status}</span>
                        <span class="text-[10px] text-on-surface-variant/60 font-label-md">${job.type}</span>
                        <span class="px-2 py-0.5 text-[9px] font-label-md uppercase tracking-widest border ${ job.platform==='linkedin' ? 'border-blue-400 text-blue-500' : job.platform==='shine' ? 'border-orange-400 text-orange-500' : job.platform==='internshala' ? 'border-green-500 text-green-600' : 'border-surface-dim text-on-surface-variant' }">${job.platform}</span>
                    </div>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <span class="font-label-md text-[11px] text-on-surface-variant uppercase tracking-widest">Match Precision</span>
                        <span class="font-bold text-vibrant-blue font-label-md">${job.match}%</span>
                    </div>
                    <div class="w-full bg-surface-container-low h-1 overflow-hidden">
                        <div class="progress-bar h-full bg-vibrant-blue" style="width: 0%" data-width="${job.match}%"></div>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 py-1">
                    ${job.skills.matched.map(s => `<span class="bg-surface-container-low text-primary px-2 py-0.5 text-[11px] font-medium border border-surface-dim">${s}</span>`).join('')}
                    ${job.skills.missing.map(s => `<span class="border border-error/30 text-error px-2 py-0.5 text-[11px] font-medium">${s}</span>`).join('')}
                </div>

                ${job.recommendation ? `<p class="text-[11px] text-on-surface-variant italic">${job.recommendation}</p>` : ''}

                <div class="mt-auto flex gap-3 pt-4 border-t border-surface-container-low">
                    <button onclick="window.open('${job.url}', '_blank')" class="flex-1 bg-primary text-white py-2 font-label-md text-[12px] uppercase tracking-widest transition-all hover:bg-vibrant-blue active:scale-[0.98] interactive">View</button>
                    <button onclick="markApplied(${job.id})" id="btn-${job.id}" class="flex-1 border border-primary text-primary py-2 font-label-md text-[12px] uppercase tracking-widest hover:bg-surface-container transition-all active:scale-[0.98] interactive ${job.applied ? 'bg-primary/5 text-primary/40 border-primary/20 pointer-events-none' : ''}">
                        ${job.applied ? 'Applied' : 'Mark'}
                    </button>
                </div>
            </div>
        `).join('');

        requestAnimationFrame(() => {
            container.querySelectorAll('.card-entry').forEach(card => card.classList.add('visible'));
        });

        setTimeout(() => {
            document.querySelectorAll('.progress-bar').forEach(bar => {
                bar.style.width = bar.getAttribute('data-width');
            });
        }, 150);

        updateInteractiveListeners();
    }

    // ── Mark Applied — calls real API ────────────────────
    function markApplied(id) {
        fetch(`/api/jobs/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'applied' })
        })
        .then(r => r.json())
        .then(() => {
            // Update local data
            const job = allJobs.find(j => j.id === id);
            if (job) job.applied = true;

            // Refresh view
            applyFilters();
        })
        .catch(err => console.error('Mark applied failed:', err));
    }

    // ── Filters ──────────────────────────────────────────
    function applyFilters() {
        let filtered = allJobs.filter(job => {
            const matchesSearch = !searchQuery ||
                job.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                job.company.toLowerCase().includes(searchQuery.toLowerCase());

            let matchesFilter = true;
            if (currentFilter === 'aiml')    matchesFilter = job.type === 'AI/ML';
            if (currentFilter === 'devops')  matchesFilter = job.type === 'DevOps';
            if (currentFilter === 'urgent')  matchesFilter = job.status === 'urgent';
            if (currentFilter === 'review')  matchesFilter = job.status === 'review';
            if (currentFilter === 'applied') matchesFilter = job.applied === true;

            return matchesSearch && matchesFilter;
        });
        renderJobs(filtered);
        loadStats(filtered);
    }

    document.getElementById('job-search').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        applyFilters();
    });

    document.getElementById('filter-buttons').addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
            document.querySelectorAll('#filter-buttons button').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white');
                btn.classList.add('bg-surface-container', 'text-primary');
            });
            e.target.classList.add('bg-primary', 'text-white');
            e.target.classList.remove('bg-surface-container', 'text-primary');
            currentFilter = e.target.getAttribute('data-filter');
            // sync stat card highlight
            document.querySelectorAll('#stats-container [data-filter]').forEach(c => {
                c.classList.toggle('ring-2', c.getAttribute('data-filter') === currentFilter);
                c.classList.toggle('ring-vibrant-blue', c.getAttribute('data-filter') === currentFilter);
            });
            applyFilters();
        }
    });

    // ── Counter Animation (unchanged) ────────────────────
    function animateCounters() {
        document.querySelectorAll('.counter').forEach(counter => {
            const target = +counter.getAttribute('data-target');
            const duration = 1200;
            const startTime = performance.now();
            const update = (currentTime) => {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = 1 - Math.pow(1 - progress, 4);
                counter.innerText = Math.floor(easedProgress * target);
                if (progress < 1) requestAnimationFrame(update);
                else counter.innerText = target;
            };
            requestAnimationFrame(update);
        });
    }
</script>
</body></html>
